name: Verify PlantillaPro Studio v1.0.0 release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.0.0"
          zip_name="PlantillaProStudio-v1.0.0-windows-x64.zip"
          checksum_name="SHA256SUMS.txt"
          json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets)"
          zip_count="$(printf '%s' "$json" | jq --arg name "$zip_name" '[.assets[]? | select(.name == $name)] | length')"
          checksum_count="$(printf '%s' "$json" | jq --arg name "$checksum_name" '[.assets[]? | select(.name == $name)] | length')"
          test "$zip_count" -eq 1
          test "$checksum_count" -eq 1
          release_url="$(printf '%s' "$json" | jq -r '.url')"
          zip_size="$(printf '%s' "$json" | jq -r --arg name "$zip_name" '.assets[] | select(.name == $name) | .size')"
          {
            echo "## Release v1.0.0 verificado"
            echo "- Release: $release_url"
            echo "- Paquete: $zip_name"
            echo "- Tamaño: $zip_size bytes"
            echo "- Checksum: $checksum_name"
          } >> "$GITHUB_STEP_SUMMARY"
