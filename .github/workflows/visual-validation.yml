name: Tests and visual validation

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -q -r requirements.txt
      - name: Run tests
        run: python -m pytest -q > pytest-output.txt 2>&1
      - name: Generate visual validation
        run: python scripts/visual_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-validation
          path: |
            pytest-output.txt
            artifacts/
          if-no-files-found: warn
