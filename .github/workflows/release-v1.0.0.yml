name: Publish PlantillaPro Studio v1.0.0

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create release and tag if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0"
          gh release view $tag 2>$null 1>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target "${{ github.sha }}" `
              --title "PlantillaPro Studio v1.0.0" `
              --notes-file RELEASE_NOTES_v1.0.0.md
          } else {
            Write-Host "El release $tag ya existe; se actualizarán sus archivos."
          }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Windows application
        shell: cmd
        run: build_windows.bat

      - name: Package release
        shell: pwsh
        run: |
          $version = "v1.0.0"
          $archive = "PlantillaProStudio-$version-windows-x64.zip"
          if (-not (Test-Path "dist\PlantillaProStudio\PlantillaProStudio.exe")) {
            throw "No se encontró el ejecutable compilado."
          }
          Compress-Archive -Path "dist\PlantillaProStudio\*" -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Item $archive | Format-List Name, Length
          Get-Content SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantillaProStudio-v1.0.0-windows-x64
          path: |
            PlantillaProStudio-v1.0.0-windows-x64.zip
            SHA256SUMS.txt

      - name: Attach files to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0 `
            PlantillaProStudio-v1.0.0-windows-x64.zip `
            SHA256SUMS.txt `
            --clobber
