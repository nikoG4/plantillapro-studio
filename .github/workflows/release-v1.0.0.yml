name: Publish PlantillaPro Studio v1.0.0

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: v1.0.0')
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows application
        shell: cmd
        run: build_windows.bat

      - name: Package release
        shell: pwsh
        run: |
          $version = "v1.0.0"
          $archive = "PlantillaProStudio-$version-windows-x64.zip"
          if (-not (Test-Path "dist\PlantillaProStudio\PlantillaProStudio.exe")) {
            throw "No se encontró el ejecutable compilado."
          }
          Compress-Archive -Path "dist\PlantillaProStudio\*" -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Item $archive | Format-List Name, Length
          Get-Content SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantillaProStudio-v1.0.0-windows-x64
          path: |
            PlantillaProStudio-v1.0.0-windows-x64.zip
            SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0"
          gh release view $tag 2>$null 1>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "El release $tag ya existe; no se vuelve a crear."
            exit 0
          }
          gh release create $tag `
            PlantillaProStudio-v1.0.0-windows-x64.zip `
            SHA256SUMS.txt `
            --target "${{ github.sha }}" `
            --title "PlantillaPro Studio v1.0.0" `
            --notes-file RELEASE_NOTES_v1.0.0.md
